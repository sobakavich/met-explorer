<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Met Collection Explorer</title>
    <meta name="description" content="Search and curate artworks from The Met Collection API or a full static index" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="icon" href="https://www.metmuseum.org/favicon.ico" />
    <style>
      .skeleton { position: relative; overflow: hidden; background-color: #e5e7eb; }
      .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        animation: shimmer 1.4s infinite; }
      @keyframes shimmer { 100% { transform: translateX(100%); } }
    </style>
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;
      const API = "https://collectionapi.metmuseum.org/public/collection/v1";

      // ---------- Utilities ----------
      const sleep = (ms) => new Promise((res) => setTimeout(res, ms));
      function classNames(...xs) { return xs.filter(Boolean).join(" "); }
      function useDebouncedValue(value, delay = 400) {
        const [v, setV] = useState(value);
        useEffect(() => { const t = setTimeout(() => setV(value), delay); return () => clearTimeout(t); }, [value, delay]);
        return v;
      }
      async function withConcurrency(items, concurrency, worker) {
        const out = new Array(items.length);
        let i = 0;
        await Promise.all(new Array(concurrency).fill(0).map(async () => {
          while (i < items.length) {
            const idx = i++;
            out[idx] = await worker(items[idx], idx);
          }
        }));
        return out;
      }

      // ---------- Tiny search helpers for static index ----------
      function normalize(s) { return (s||"").toString().toLowerCase(); }
      function tokenize(q) { return normalize(q).split(/\s+/).filter(Boolean); }
      function strIncludes(hay, needle) { return normalize(hay).includes(normalize(needle)); }
      function matchesTokens(fields, q) {
        const toks = tokenize(q);
        if (!toks.length) return true;
        const hay = normalize(fields.join("   "));
        return toks.every(t => hay.includes(t));
      }

      // ---------- UI bits ----------
      function Badge({ children }) {
        return <span className="px-2 py-0.5 rounded-full bg-gray-100 text-gray-700 text-xs font-medium">{children}</span>;
      }
      function Toggle({ label, checked, onChange, title }) {
        const id = React.useId();
        return (
          <label htmlFor={id} className="inline-flex items-center gap-2 cursor-pointer" title={title}>
            <input id={id} type="checkbox" className="h-4 w-4" checked={checked} onChange={(e) => onChange(e.target.checked)} />
            <span className="text-sm select-none">{label}</span>
          </label>
        );
      }
      function NumberField({ label, value, onChange, placeholder, min, max }) {
        const id = React.useId();
        return (
          <div className="flex flex-col">
            <label htmlFor={id} className="text-xs font-medium text-gray-600">{label}</label>
            <input id={id} type="number" className="mt-1 rounded-md border border-gray-300 px-2 py-1"
              value={value ?? ""} onChange={(e) => onChange(e.target.value === "" ? undefined : Number(e.target.value))}
              placeholder={placeholder} min={min} max={max} />
          </div>
        );
      }
      function TextField({ label, value, onChange, placeholder, title }) {
        const id = React.useId();
        return (
          <div className="flex flex-col">
            <label htmlFor={id} className="text-xs font-medium text-gray-600">{label}</label>
            <input id={id} type="text" className="mt-1 rounded-md border border-gray-300 px-2 py-1"
              value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} title={title} />
          </div>
        );
      }
      function Select({ label, value, onChange, options, placeholder }) {
        const id = React.useId();
        return (
          <div className="flex flex-col">
            <label htmlFor={id} className="text-xs font-medium text-gray-600">{label}</label>
            <select id={id} className="mt-1 rounded-md border border-gray-300 px-2 py-1"
              value={value ?? ""} onChange={(e) => onChange(e.target.value === "" ? undefined : Number(e.target.value))}>
              <option value="">{placeholder || "— Any —"}</option>
              {options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
          </div>
        );
      }
      function ToolbarButton({ children, onClick, disabled, title }) {
        return (
          <button onClick={onClick} disabled={disabled}
            title={title}
            className={classNames("rounded-md px-3 py-2 text-sm font-medium border",
              disabled ? "bg-gray-100 text-gray-400 border-gray-200" : "bg-white hover:bg-gray-50 border-gray-300")}
          >{children}</button>
        );
      }

      // ---------- App ----------
      function App() {
        // Mode
        const [useCatalog, setUseCatalog] = useState(false);
        const [catalogReady, setCatalogReady] = useState(false);
        const [catalogProgress, setCatalogProgress] = useState({loaded:0,total:0});
        const [catalogRows, setCatalogRows] = useState([]); // minimal rows for full-catalog search
        const [catalogError, setCatalogError] = useState(null);

        // Filters
        const [q, setQ] = useState("");
        const [isOnView, setIsOnView] = useState(false);
        const [hasImages, setHasImages] = useState(true);
        const [isHighlight, setIsHighlight] = useState(false);
        const [artistOrCulture, setArtistOrCulture] = useState(false);
        const [departmentId, setDepartmentId] = useState();
        const [medium, setMedium] = useState("");
        const [geoLocation, setGeoLocation] = useState("");
        theDate = new Date(); // no-op placeholder to avoid unused warnings
        const [dateBegin, setDateBegin] = useState();
        const [dateEnd, setDateEnd] = useState();
        const [tags, setTags] = useState("");
        const [titleOnly, setTitleOnly] = useState(false);
        const debouncedQ = useDebouncedValue(q, 300);

        // Data
        const [departments, setDepartments] = useState([]);
        const [objectIDs, setObjectIDs] = useState([]);
        const [total, setTotal] = useState(0);
        const [loadingIDs, setLoadingIDs] = useState(false);
        const [loadingDetails, setLoadingDetails] = useState(false);
        const [error, setError] = useState(null);
        const [details, setDetails] = useState([]);
        const [page, setPage] = useState(0);
        const PAGE_SIZE = 24;
        const [selection, setSelection] = useState(() => {
          try { const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
            const s = hash.get("ids"); return s ? new Set(s.split(",").map(Number)) : new Set(); } catch { return new Set(); }
        });

        // Departments
        useEffect(() => {
          fetch(`${API}/departments`).then(r=>r.json()).then(data=>{
            setDepartments((data.departments||[]).map(d=>({value:d.departmentId,label:d.displayName})));
          }).catch(e=>setError(`Failed to load departments: ${e}`));
        },[]);

        // Build API search URL
        const searchURL = useMemo(() => {
          const p = new URLSearchParams();
          p.set("q", debouncedQ || "");
          if (typeof departmentId === "number") p.set("departmentId", String(departmentId));
          if (isOnView) p.set("isOnView", "true");
          if (hasImages) p.set("hasImages", "true");
          if (isHighlight) p.set("isHighlight", "true");
          if (artistOrCulture) p.set("artistOrCulture", "true");
          if (medium.trim()) p.set("medium", medium.trim());
          if (geoLocation.trim()) p.set("geoLocation", geoLocation.trim());
          if (dateBegin !== undefined) p.set("dateBegin", String(dateBegin));
          if (dateEnd !== undefined) p.set("dateEnd", String(dateEnd));
          if (tags.trim()) p.set("tags", tags.trim());
          if (titleOnly) p.set("title", "true");
          return `${API}/search?${p.toString()}`;
        }, [debouncedQ, departmentId, isOnView, hasImages, isHighlight, artistOrCulture, medium, geoLocation, dateBegin, dateEnd, tags, titleOnly]);

        // API mode search
        useEffect(() => {
          if (useCatalog) return; // skip in catalog mode
          let cancelled = false;
          async function run() {
            setLoadingIDs(true); setError(null); setDetails([]); setPage(0);
            try {
              const r = await fetch(searchURL); if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
              const data = await r.json(); if (cancelled) return;
              setObjectIDs(data.objectIDs || []); setTotal(data.total || 0);
            } catch (e) { if (!cancelled) setError(`Search failed: ${e.message}`); }
            finally { if (!cancelled) setLoadingIDs(false); }
          }
          run();
          return () => { cancelled = true; };
        }, [searchURL, useCatalog]);

        // Load details for current page (API mode)
        async function loadMore() {
          if (useCatalog) return; // handled differently below
          if (loadingDetails) return; setLoadingDetails(true);
          const start = page * PAGE_SIZE; const slice = objectIDs.slice(start, start + PAGE_SIZE);
          try {
            const results = await withConcurrency(slice, 8, async (id) => {
              for (let attempt = 0; attempt < 3; attempt++) {
                try { const r = await fetch(`${API}/objects/${id}`); if (!r.ok) throw new Error(`${r.status}`); return await r.json(); }
                catch (e) { await sleep(200 * (attempt + 1)); }
              } return null;
            });
            setDetails((d) => [...d, ...results.filter(Boolean)]); setPage((p) => p + 1);
          } catch (e) { setError(`Failed loading details: ${e.message}`); }
          finally { setLoadingDetails(false); }
        }

        useEffect(() => { if (!useCatalog && !loadingIDs && objectIDs.length) loadMore(); }, [useCatalog, loadingIDs, objectIDs]);

        // Selection helpers
        function toggleSelect(id) {
          setSelection((s) => {
            const next = new Set(s); next.has(id) ? next.delete(id) : next.add(id);
            const idsStr = Array.from(next).join(",");
            const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
            if (idsStr) params.set("ids", idsStr); else params.delete("ids"); window.location.hash = params.toString();
            return next;
          });
        }
        function clearSelection() { setSelection(new Set()); window.location.hash = ""; }

        // Export helpers (works in both modes)
        function exportJSON(rows) {
          const chosen = (rows || details).filter((d) => selection.has(d.objectID));
          const blob = new Blob([JSON.stringify(chosen, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob); download(url, `met-selection-${new Date().toISOString().slice(0,10)}.json`);
        }
        function exportCSV(rows) {
          const chosen = (rows || details).filter((d) => selection.has(d.objectID));
          const cols = ["objectID","title","artistDisplayName","artistDisplayBio","artistNationality","objectDate","culture","period","medium","dimensions","department","repository","isPublicDomain","primaryImage","objectURL"];
          const esc = (x) => '"' + String(x ?? '').replaceAll('"', '""') + '"';
          const lines = [cols.join(",")].concat(chosen.map(o => cols.map(c => esc(o[c])).join(",")));
          const blob = new Blob([lines.join("\n")], { type: "text/csv" });
          const url = URL.createObjectURL(blob); download(url, `met-selection-${new Date().toISOString().slice(0,10)}.csv`);
        }
        function download(url, filename) { const a = document.createElement('a'); a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url); }

        // --------- FULL CATALOGUE MODE ---------
        async function ensureCatalogLoaded() {
          if (catalogReady || catalogError) return;
          try {
            const res = await fetch("./catalog/manifest.json");
            if (!res.ok) throw new Error(`manifest ${res.status}`);
            const man = await res.json();
            const totalChunks = man.chunks.length; let loaded=0; setCatalogProgress({loaded, total: totalChunks});
            const allRows = [];
            for (const fname of man.chunks) {
              const r = await fetch(`./catalog/${fname}`);
              if (!r.ok) throw new Error(`chunk ${fname}: ${r.status}`);
              const rows = await r.json();
              allRows.push(...rows);
              loaded++; setCatalogProgress({loaded, total: totalChunks});
              await sleep(0);
            }
            setCatalogRows(allRows); setCatalogReady(true);
          } catch (e) { setCatalogError(e.message); }
        }

        // Catalogue search (client-side)
        const filteredCatalogRows = useMemo(() => {
          if (!useCatalog || !catalogReady) return [];
          const rows = catalogRows;
          const depOK = (r) => departmentId ? r.department === departments.find(d=>d.value===departmentId)?.label : true;
          const imgOK = (r) => hasImages ? !!r.primaryImageSmall : true;
          const onViewOK = (r) => isOnView ? !!r.isOnView : true;
          const hiOK = (r) => isHighlight ? !!r.isHighlight : true;
          const geoOK = (r) => geoLocation ? r.geoLocation && geoLocation.split('|').some(g => strIncludes(r.geoLocation, g)) : true;
          const mediumOK = (r) => medium ? medium.split('|').some(m => strIncludes(r.medium, m)) : true;
          const dateOK = (r) => {
            if (dateBegin === undefined && dateEnd === undefined) return true;
            const b = (r.objectBeginDate ?? Number.NEGATIVE_INFINITY);
            const e = (r.objectEndDate ?? Number.POSITIVE_INFINITY);
            const from = (dateBegin ?? Number.NEGATIVE_INFINITY);
            const to = (dateEnd ?? Number.POSITIVE_INFINITY);
            return e >= from && b <= to;
          };
          const qOK = (r) => {
            if (!debouncedQ) return true;
            if (titleOnly) return strIncludes(r.title, debouncedQ);
            if (artistOrCulture) return strIncludes(r.artistDisplayName, debouncedQ) || strIncludes(r.culture, debouncedQ);
            return matchesTokens([
              r.title, r.artistDisplayName, r.culture, r.medium, r.department, r.objectDate, r.geoLocation, (r.tags||[]).join(" ")
            ], debouncedQ);
          };
          const tagOK = (r) => tags ? ((r.tags||[]).length && tags.split('|').every(t => (r.tags||[]).some(x => strIncludes(x, t)))) : true;

          return rows.filter(r => depOK(r) && imgOK(r) && onViewOK(r) && hiOK(r) && geoOK(r) && mediumOK(r) && dateOK(r) && qOK(r) && tagOK(r));
        }, [useCatalog, catalogReady, catalogRows, debouncedQ, departmentId, departments, hasImages, isOnView, isHighlight, geoLocation, medium, dateBegin, dateEnd, titleOnly, artistOrCulture, tags]);

        const totalShown = useCatalog ? Math.min(((page+1)*PAGE_SIZE), filteredCatalogRows.length) : details.length;
        const grandTotal = useCatalog ? filteredCatalogRows.length : total;

        useEffect(() => { if (useCatalog) { setPage(0); ensureCatalogLoaded(); } }, [useCatalog]);

        return (
          <div className="mx-auto max-w-7xl p-4 md:p-6">
            <header className="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
              <div>
                <h1 className="text-2xl md:text-3xl font-semibold tracking-tight">Met Collection Explorer</h1>
                <p className="text-sm text-gray-600">Search via The Met API or a full offline index you host yourself.</p>
              </div>
              <div className="flex items-center gap-2">
                <Toggle label="Full Catalogue (static)" checked={useCatalog} onChange={setUseCatalog} title="Use /catalog/manifest.json if present" />
                <ToolbarButton onClick={() => window.open("https://www.metmuseum.org/art/collection", "_blank")}>Open Collection Site</ToolbarButton>
                <ToolbarButton onClick={() => window.open("https://collectionapi.metmuseum.org/public/collection/v1", "_blank")}>API Root</ToolbarButton>
                <ToolbarButton onClick={() => window.open("https://metmuseum.github.io/", "_blank")}>API Docs</ToolbarButton>
              </div>
            </header>

            {/* Filters */}
            <section className="mt-4 rounded-xl bg-white p-4 shadow-sm ring-1 ring-gray-200">
              <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <TextField label="Search (q)" value={q} onChange={setQ} placeholder="e.g., sunflower, Rembrandt, bronze" />
                <Select label="Department" value={departmentId} onChange={setDepartmentId} options={departments} placeholder="All departments" />
                <TextField label="Medium" value={medium} onChange={setMedium} placeholder="e.g., Oil|Canvas|Bronze" title="Use | to include multiple mediums" />
                <TextField label="Geographic Location" value={geoLocation} onChange={setGeoLocation} placeholder="e.g., France|Egypt|Japan" />
                <NumberField label="Date Begin (year)" value={dateBegin} onChange={setDateBegin} placeholder="e.g., 1200" />
                <NumberField label="Date End (year)" value={dateEnd} onChange={setDateEnd} placeholder="e.g., 1890" />
                <TextField label="Tags (static index)" value={tags} onChange={setTags} placeholder="e.g., Flowers|Portraits" title="Pipe-separated list of tags" />
                <div className="flex flex-col gap-2 justify-end">
                  <div className="flex flex-wrap gap-4">
                    <Toggle label="Has Images" checked={hasImages} onChange={setHasImages} title="Only items with images" />
                    <Toggle label="On View" checked={isOnView} onChange={setIsOnView} title="Currently on view in the museum" />
                    <Toggle label="Highlights" checked={isHighlight} onChange={setIsHighlight} title="Met highlights" />
                    <Toggle label="Artist or Culture" checked={artistOrCulture} onChange={setArtistOrCulture} title="Interpret q as artist or culture" />
                    <Toggle label="Title Only" checked={titleOnly} onChange={setTitleOnly} title="Restrict q to title field" />
                  </div>
                </div>
              </div>
              <div className="mt-4 flex flex-wrap items-center justify-between gap-3 text-sm">
                <div className="flex items-center gap-2">
                  <Badge>{grandTotal.toLocaleString()} results</Badge>
                  <span className="text-gray-500">Showing {totalShown} of {grandTotal.toLocaleString()}</span>
                  {useCatalog && !catalogReady && (
                    <span className="text-gray-500">Loading catalog… {catalogProgress.loaded}/{catalogProgress.total} chunks</span>
                  )}
                  {useCatalog && catalogError && (
                    <span className="text-red-600">Catalog error: {catalogError}</span>
                  )}
                </div>
                <div className="flex items-center gap-2">
                  <ToolbarButton onClick={() => { setQ(""); setDepartmentId(undefined); setMedium(""); setGeoLocation(""); setDateBegin(undefined); setDateEnd(undefined); setIsOnView(false); setHasImages(true); setIsHighlight(false); setArtistOrCulture(false); setTags(""); setTitleOnly(false); }}>Reset</ToolbarButton>
                  <ToolbarButton onClick={() => (useCatalog ? exportCSV(filteredCatalogRows.slice(0, (page+1)*PAGE_SIZE)) : exportCSV())} disabled={!selection.size} title="Export selected to CSV">Export CSV</ToolbarButton>
                  <ToolbarButton onClick={() => (useCatalog ? exportJSON(filteredCatalogRows.slice(0, (page+1)*PAGE_SIZE)) : exportJSON())} disabled={!selection.size} title="Export selected to JSON">Export JSON</ToolbarButton>
                  <ToolbarButton onClick={clearSelection} disabled={!selection.size}>Clear Selected</ToolbarButton>
                </div>
              </div>
            </section>

            {/* Errors */}
            {error && !useCatalog && (
              <div className="mt-4 rounded-md border border-red-300 bg-red-50 p-3 text-sm text-red-800">{error}</div>
            )}

            {/* Results grid */}
            <section className="mt-4">
              {(!useCatalog && loadingIDs) && (
                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                  {new Array(8).fill(0).map((_, i) => (
                    <div key={i} className="rounded-lg border border-gray-200 bg-white p-3">
                      <div className="skeleton aspect-[4/3] rounded-md"></div>
                      <div className="mt-3 h-4 w-2/3 skeleton rounded"></div>
                      <div className="mt-2 h-3 w-1/3 skeleton rounded"></div>
                    </div>
                  ))}
                </div>
              )}

              {(!useCatalog && !loadingIDs && details.length === 0) && (
                <div className="rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center text-gray-600">
                  Enter a search and adjust filters to begin exploring the collection.
                </div>
              )}

              {/* API MODE CARDS */}
              {!useCatalog && (
                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                  {details.map((o) => (
                    <article key={o.objectID} className="group rounded-lg border border-gray-200 bg-white overflow-hidden flex flex-col">
                      <div className="relative">
                        <img src={o.primaryImageSmall || o.primaryImage} alt={o.title} className="aspect-[4/3] w-full object-cover" loading="lazy" />
                        <button onClick={() => toggleSelect(o.objectID)}
                          className={classNames("absolute top-2 right-2 rounded-md px-2 py-1 text-xs font-medium",
                            selection.has(o.objectID) ? "bg-blue-600 text-white" : "bg-white/90 text-gray-800 border border-gray-300")}
                          title={selection.has(o.objectID) ? "Remove from selection" : "Add to selection"}
                        >{selection.has(o.objectID) ? "Selected" : "Select"}</button>
                      </div>
                      <div className="flex-1 p-3 flex flex-col gap-1">
                        <h3 className="font-semibold leading-tight line-clamp-2">{o.title}</h3>
                        <p className="text-sm text-gray-700 line-clamp-1">{o.artistDisplayName || o.culture || o.department}</p>
                        <p className="text-xs text-gray-500">{o.objectDate}</p>
                        <div className="mt-2 flex flex-wrap gap-2">
                          {o.isPublicDomain && <Badge>Open Access</Badge>}
                          {o.isOnView && <Badge>On View</Badge>}
                          {o.department && <Badge>{o.department}</Badge>}
                        </div>
                      </div>
                      <div className="px-3 pb-3 flex items-center gap-2">
                        {o.objectURL && <a className="text-sm underline" href={o.objectURL} target="_blank" rel="noreferrer">Object Page</a>}
                        {o.primaryImage && <a className="text-sm underline" href={o.primaryImage} target="_blank" rel="noreferrer">Full Image</a>}
                      </div>
                    </article>
                  ))}
                </div>
              )}

              {/* CATALOG MODE CARDS */}
              {useCatalog && (
                <>
                  {!catalogReady && (
                    <div className="rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center text-gray-600">
                      {catalogError ? (
                        <div>
                          <div className="text-red-600 font-medium">Could not load /catalog/manifest.json</div>
                          <div className="text-sm">Add the static index (see README) or switch off Full Catalogue mode.</div>
                        </div>
                      ) : (
                        <div>Loading full catalogue… {catalogProgress.loaded}/{catalogProgress.total} chunks</div>
                      )}
                    </div>
                  )}
                  {catalogReady && filteredCatalogRows.length === 0 && (
                    <div className="rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center text-gray-600">
                      No matches. Try broadening your filters.
                    </div>
                  )}
                  {catalogReady && filteredCatalogRows.length > 0 && (
                    <>
                      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                        {filteredCatalogRows.slice(0, (page+1)*PAGE_SIZE).map((o) => (
                          <article key={o.objectID} className="group rounded-lg border border-gray-200 bg-white overflow-hidden flex flex-col">
                            <div className="relative">
                              <img src={o.primaryImageSmall || o.primaryImage} alt={o.title} className="aspect-[4/3] w-full object-cover" loading="lazy" />
                              <button onClick={() => toggleSelect(o.objectID)}
                                className={classNames("absolute top-2 right-2 rounded-md px-2 py-1 text-xs font-medium",
                                  selection.has(o.objectID) ? "bg-blue-600 text-white" : "bg-white/90 text-gray-800 border border-gray-300")}
                                title={selection.has(o.objectID) ? "Remove from selection" : "Add to selection"}
                              >{selection.has(o.objectID) ? "Selected" : "Select"}</button>
                            </div>
                            <div className="flex-1 p-3 flex flex-col gap-1">
                              <h3 className="font-semibold leading-tight line-clamp-2">{o.title}</h3>
                              <p className="text-sm text-gray-700 line-clamp-1">{o.artistDisplayName || o.culture || o.department}</p>
                              <p className="text-xs text-gray-500">{o.objectDate}</p>
                              <div className="mt-2 flex flex-wrap gap-2">
                                {o.isPublicDomain && <Badge>Open Access</Badge>}
                                {o.isOnView && <Badge>On View</Badge>}
                                {o.department && <Badge>{o.department}</Badge>}
                              </div>
                            </div>
                            <div className="px-3 pb-3 flex items-center gap-2">
                              {o.objectURL && <a className="text-sm underline" href={o.objectURL} target="_blank" rel="noreferrer">Object Page</a>}
                              {o.primaryImage && <a className="text-sm underline" href={o.primaryImage} target="_blank" rel="noreferrer">Full Image</a>}
                            </div>
                          </article>
                        ))}
                      </div>
                      {(page+1)*PAGE_SIZE < filteredCatalogRows.length && (
                        <div className="mt-6 flex justify-center">
                          <button onClick={() => setPage(p=>p+1)} className="rounded-md bg-gray-900 text-white px-4 py-2 text-sm font-medium hover:bg-gray-800">
                            Load more ({filteredCatalogRows.length - Math.min((page+1)*PAGE_SIZE, filteredCatalogRows.length)} remaining)
                          </button>
                        </div>
                      )}
                    </>
                  )}
                </>
              )}
            </section>

            {/* Selection Drawer */}
            <section className="mt-8">
              <h2 className="text-lg font-semibold">Your Selection <span className="text-sm font-normal text-gray-500">{selection.size} saved</span></h2>
              {selection.size === 0 ? (
                <p className="text-sm text-gray-600">Use the “Select” button on any card to add items to your collection. You can export CSV/JSON above.</p>
              ) : (
                <div className="mt-3 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                  {Array.from(selection).map((id) => {
                    const o = (useCatalog ? filteredCatalogRows.slice(0, (page+1)*PAGE_SIZE) : details).find((d) => d.objectID === id) || { objectID:id };
                    return (
                      <div key={id} className="rounded border border-gray-200 bg-white overflow-hidden">
                        {o && o.primaryImageSmall && <img src={o.primaryImageSmall} alt={o.title||`Object ${id}`} className="aspect-square w-full object-cover" />}
                        <div className="p-2 text-xs">
                          <div className="font-medium line-clamp-2" title={o.title}>{o.title || `Object ${id}`}</div>
                          <div className="text-gray-600 line-clamp-1">{o.artistDisplayName || o.department || ''}</div>
                          <div className="mt-1 flex items-center justify-between">
                            <a className="underline" href={`https://collectionapi.metmuseum.org/public/collection/v1/objects/${id}`} target="_blank" rel="noreferrer">JSON</a>
                            <button onClick={() => toggleSelect(id)} className="text-red-600 hover:underline">Remove</button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </section>

            <footer className="my-10 text-xs text-gray-500">
              Images and data courtesy of The Metropolitan Museum of Art’s Open Access program. This site supports both the live API and a self-hosted static index.
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
